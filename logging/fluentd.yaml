apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: hackathon
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/nginx-*_hackathon_*.log
      pos_file /tmp/fluentd-nginx.pos
      tag hackathon.nginx
      read_from_head true
      <parse>
        @type none
      </parse>
    </source>

    <match hackathon.nginx>
      @type stdout
    </match>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: hackathon
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      containers:
      - name: fluentd
        image: fluent/fluentd:v1.18-debian-1
        securityContext:
          runAsUser: 0
        env:
        - name: FLUENTD_CONF
          value: fluent.conf
        volumeMounts:
        - name: config
          mountPath: /fluentd/etc/fluent.conf
          subPath: fluent.conf
        - name: varlog
          mountPath: /var/log
      volumes:
      - name: config
        configMap:
          name: fluentd-config
      - name: varlog
        hostPath:
          path: /var/log
